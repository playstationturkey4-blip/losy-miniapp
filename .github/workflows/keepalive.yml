name: Keep-Alive 24/7 Render Bot & Mini App

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Active 24/7 Keep-Alive Loop (stays alive for 40 minutes)
        run: |
          echo "Starting active keep-alive loop at $(date)..."
          for i in {1..8}; do
            echo "Ping #$i to Render..."
            curl -s -S -f --connect-timeout 15 --max-time 30 https://losy-miniapp.onrender.com/health || echo "Render ping error"
            curl -s -S -f --connect-timeout 15 --max-time 30 https://losy-miniapp.vercel.app/ping || echo "Vercel proxy ping error"
            sleep 270
          done
          echo "Keepalive cycle finished."
