server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # HTML and service worker: always revalidate
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Static assets: immutable 1 year cache
    location ~* \.(woff2|woff|ttf|webp|png|jpg|jpeg|svg|mp3|mp4|css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fallback to index.html for SPA routing if needed
    location / {
        try_files $uri $uri/ /index.html;
    }
}
