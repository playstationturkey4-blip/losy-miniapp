  <style>
/* ========================================
   LOSY MINES - STYLES
   ======================================== */

:root {
  --mines-board-size: min(85vw, 420px);
  --cell-size: calc((var(--mines-board-size) - (12 * 4)) / 5);
}

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background:
    linear-gradient(rgba(5, 7, 10, 0.78), rgba(5, 7, 10, 0.92)),
    url('/assets/bg-nebula.webp') center / cover no-repeat,
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
  position: relative;
}

/* NAV BAR */
.mines-nav {
  padding-top: env(safe-area-inset-top, 1rem);
}

/* BALANCE BAR */
.mines-balance {
  display: flex;
  gap: 2rem;
  align-items: center;
  justify-content: center;
  padding: 1.5rem clamp(1.25rem, 4vw, 3rem);
  border-bottom: 1px solid var(--line);
  background: rgba(10, 14, 20, 0.8);
  backdrop-filter: blur(10px);
}

.balance-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.balance-value {
  font-family: var(--font-brand);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

/* MAIN CONTENT */
.mines-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(1rem, 3vw, 2rem) clamp(1.25rem, 4vw, 3rem);
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

/* GAME HEADER */
.mines-header {
  width: 100%;
  margin-bottom: 1.5rem;
}

.mines-title {
  font-family: var(--font-display-bold);
  font-size: clamp(2.5rem, 8vw, 4rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 1.5rem;
  color: var(--ink);
  text-shadow: 0 0 30px rgba(59, 232, 255, 0.2);
}

.mines-controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1.5rem;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.control-label {
  font-family: var(--font-label);
  font-size: 0.75rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-align: center;
}

/* MINES SELECTOR */
.mines-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  background: rgba(238, 244, 248, 0.05);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.75rem;
}

.selector-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-brand);
  font-size: 1.75rem;
  font-weight: 600;
  color: var(--ink);
  background: rgba(238, 244, 248, 0.08);
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
}

.selector-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: scale(1.05);
}

.selector-value {
  font-family: var(--font-brand);
  font-size: 2rem;
  font-weight: 700;
  min-width: 60px;
  text-align: center;
  color: var(--ink);
}

/* MULTIPLIER DISPLAY */
.multiplier-display {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(59, 232, 255, 0.08);
  border: 1px solid rgba(59, 232, 255, 0.3);
  border-radius: 8px;
}

.multiplier-value {
  font-family: var(--font-brand);
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(59, 232, 255, 0.5);
}

.multiplier-value.updated {
  animation: multiplierPulse 0.6s var(--ease);
}

@keyframes multiplierPulse {
  0% {
    transform: scale(1);
    opacity: 1;
    text-shadow: 0 0 20px rgba(59, 232, 255, 0.5);
  }
  50% {
    transform: scale(1.15);
    opacity: 0.7;
    text-shadow: 0 0 40px rgba(59, 232, 255, 1);
  }
  100% {
    transform: scale(1);
    opacity: 1;
    text-shadow: 0 0 20px rgba(59, 232, 255, 0.5);
  }
}

/* BOARD CONTAINER */
.mines-board-container {
  width: var(--mines-board-size);
  height: var(--mines-board-size);
  margin: 2rem auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mines-board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 12px;
  width: 100%;
  height: 100%;
  background: rgba(10, 14, 20, 0.8);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 
    0 0 0 1px rgba(238, 244, 248, 0.1),
    0 20px 60px -20px rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
}

/* CELL */
.cell {
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s var(--ease), box-shadow 0.2s var(--ease);
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: reduce) {
  .cell {
    transition: none;
  }
}

.cell-inner {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(238, 244, 248, 0.08);
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: all 0.3s var(--ease);
}

.cell:hover .cell-inner {
  border-color: rgba(59, 232, 255, 0.4);
  box-shadow: 0 0 16px rgba(59, 232, 255, 0.2);
}

.cell.tapped .cell-inner {
  transform: scale(0.94);
}

.cell.revealed .cell-inner {
  transform: scale(1);
  opacity: 1;
}

.cell.selected .cell-inner {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(59, 232, 255, 0.4);
}

.cell.safe .cell-inner {
  background: rgba(59, 232, 255, 0.12);
  border-color: rgba(59, 232, 255, 0.5);
}

.cell.mine-hit .cell-inner {
  background: radial-gradient(circle at center, rgba(255, 59, 92, 0.45) 0%, rgba(20, 5, 10, 0.95) 75%) !important;
  border-color: #ff3b5c !important;
  box-shadow: 0 0 22px rgba(255, 59, 92, 0.8), inset 0 0 14px rgba(255, 59, 92, 0.6) !important;
  animation: cellMinePulse 0.9s ease infinite alternate;
}

.cell.cell-mine .cell-inner {
  background: rgba(255, 71, 87, 0.18) !important;
  border-color: rgba(255, 71, 87, 0.65) !important;
}

.cell-image.mine-active-img {
  animation: minePopIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  filter: drop-shadow(0 0 14px #ff3b5c) !important;
  transform: scale(1.05);
}

@keyframes minePopIn {
  0% { transform: scale(0.2); opacity: 0; }
  50% { transform: scale(1.28); opacity: 1; }
  100% { transform: scale(1.05); opacity: 1; }
}

@keyframes cellMinePulse {
  0% { box-shadow: 0 0 14px rgba(255, 59, 92, 0.6); }
  100% { box-shadow: 0 0 28px rgba(255, 59, 92, 1.0); }
}

.cell-explosion-blast {
  position: absolute;
  inset: -20%;
  width: 140%;
  height: 140%;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(circle, rgba(255, 240, 120, 0.95) 0%, rgba(255, 80, 50, 0.85) 35%, rgba(255, 30, 0, 0) 70%);
  border-radius: 50%;
  animation: blastWave 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes blastWave {
  0% { transform: scale(0.2); opacity: 1; }
  45% { transform: scale(1.3); opacity: 0.95; }
  100% { transform: scale(1.9); opacity: 0; }
}

.cell.disabled {
  pointer-events: none;
  opacity: 0.6;
}

/* CELL IMAGES */
.cell-image {
  width: 70%;
  height: 70%;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
  transition: all 0.3s var(--ease);
}

.cell.revealed .cell-image {
  animation: cellReveal 0.4s var(--ease);
}

@keyframes cellReveal {
  0% {
    opacity: 0;
    transform: scale(0.8) translateY(10px);
  }
  50% {
    opacity: 1;
    transform: scale(1.08) translateY(-5px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* BET SECTION */
.mines-bet-section {
  width: 100%;
  margin-bottom: 1.5rem;
}

.bet-group {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  max-width: 400px;
  margin: 0 auto;
}

.bet-label {

.balance-item {

.mines-nav-actions {

.mines-main {

}

.mines-header {
  margin-bottom: 0.25rem;
  flex-shrink: 0;
  width: 100%;
}

.mines-title {

  margin-bottom: 0.25rem;

.mines-controls {

  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.control-group {
  gap: 0.25rem;
}

.control-label {
  font-size: 0.68rem;

}

  padding: 0.3rem 0.5rem;

  border-radius: 8px;
}

.selector-btn {

  font-size: 1.3rem;
}

.selector-value {
  font-size: 1.35rem;
  min-width: 40px;
}

}

.multiplier-value {
  font-size: 1.35rem;

}

.mines-board {
  gap: 8px;
  padding: 10px;
  border-radius: 14px;
}

.cell {
  border-radius: 6px;
}

.cell-inner {
  border-radius: 6px;
}

  width: 100%;
}

.bet-group {
  gap: 0.3rem;

}

.bet-label {
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  margin-bottom: 0.05rem;
}

.bet-controls {
  padding: 0.3rem 0.6rem;

  border-radius: 8px;
}

.bet-btn {

  height: 38px;
  font-size: 1.3rem;
}

.bet-value {
  font-size: 1.5rem;

.bet-quick-btn {

// Честные множители из вероятности: P(открыть k клеток при m бомбах) =
// C(25-m, k) / C(25, k). Множитель = RTP / P. Округление вниз — в пользу дома.
const RTP = 0.99; // возврат игроку (Return To Player)
const TOTAL_CELLS = 25;

function comb(n, k) {
  if (k < 0 || k > n) return 0;
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}

function multiplierFor(mines, picks) {
  const p = comb(TOTAL_CELLS - mines, picks) / comb(TOTAL_CELLS, picks);
  if (p <= 0) return 1;
  return Math.floor((RTP / p) * 100) / 100;

let soundEnabled = localStorage.getItem('losySoundBombs') !== 'off';
const audioCache = {};

/* SFX-движок: WebAudio (надёжно вне жеста) + HTMLAudio-фолбэк */
let audioCtx = null;
const audioBuffers = {};

function getCtx() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch (e) { return null; }
}
function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function decodeSounds() {
  const ctx = getCtx();
  if (!ctx) return;
  for (const k of Object.keys(SOUNDS)) {
    if (audioBuffers[k]) continue;
    try { audioBuffers[k] = ctx.decodeAudioData(b64ToArrayBuffer(SOUNDS[k].split(',')[1])); }
    catch (e) { /* фолбэк на audioCache */ }
  }
}
function playSound(name, volume = 0.8) {
  if (!soundEnabled || !SOUNDS[name]) return;
  const ctx = getCtx();
  if (ctx && audioBuffers[name]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = audioBuffers[name];
      const gain = ctx.createGain();
      gain.gain.value = volume;
      src.connect(gain); gain.connect(ctx.destination);
      src.start();
      return;
    } catch (e) { /* фолбэк */ }
  }
  try {
    const base = audioCache[name] || (audioCache[name] = new Audio(SOUNDS[name]));
    base.currentTime = 0;
    base.volume = volume;
    const playback = base.play();
    if (playback && playback.catch) playback.catch(() => {});
  } catch (e) { /* звук не критичен */ }
}
document.addEventListener('pointerdown', () => { unlockAudio(); }, { once: true });

function showToast(message) {
  let toast = document.getElementById('gameToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'gameToast';
    toast.className = 'game-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

// HIGH-PERFORMANCE FAST-TAP & AUDIO UNLOCK
// ========================================
function unlockAudio() {
  try {
    const ctx = getCtx();
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
  } catch (e) {}
}

function bindFastTap(elem, handler) {
  if (!elem) return;
  let lastExec = 0;
  const run = (e) => {
    const now = performance.now();
    if (now - lastExec < 280) return;
    lastExec = now;
    unlockAudio();
    handler(e);
  };
  elem.addEventListener('pointerup', (e) => {
    if (e.isPrimary) run(e);
  }, { passive: true });
  elem.addEventListener('click', (e) => {
    run(e);
  });
}

function bindEvents() {
  // Sound toggle
  elements.soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('losySoundBombs', soundEnabled ? 'on' : 'off');
    elements.soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled) playSound('click');
  });

  // Mines selector
  elements.minesDec.addEventListener('click', () => { playSound('click'); adjustMines(-1); });
  elements.minesInc.addEventListener('click', () => { playSound('click'); adjustMines(1); });

  // Bet controls
  elements.betDec.addEventListener('click', () => { playSound('click'); adjustBet(-10); });
  elements.betInc.addEventListener('click', () => { playSound('click'); adjustBet(10); });

  // Quick bet buttons
  document.querySelectorAll('.bet-quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      playSound('click');
      const value = btn.dataset.quick;
      if (value === 'max') {
        setBet(gameState.coinBalance);
      } else {
        setBet(parseInt(value, 10));
      }
    });
  });
  
  // Game actions
  bindFastTap(elements.playBtn, startGame);
  bindFastTap(elements.cashoutBtn, cashOut);
  elements.newGameBtn.addEventListener('click', showNewGameMenu);
  elements.newGameBtnLoss.addEventListener('click', showNewGameMenu);
  
  // Close overlay on click
  elements.resultOverlay.addEventListener('click', (e) => {
    if (e.target === elements.resultOverlay) {
      showNewGameMenu();
    }
  });
}

// ========================================
// GAME CONTROLS
// ========================================

function adjustMines(delta) {
  if (gameState.status !== 'idle' && gameState.status !== 'finished') return;
  
  const newCount = gameState.minesCount + delta;
  if (newCount >= 1 && newCount <= 15) { // Reduced max for 5x5 grid
    gameState.minesCount = newCount;
    renderBoard();
    updateUI();
  }
}

function adjustBet(amount) {
  if (gameState.status !== 'idle' && gameState.status !== 'finished') return;

  // Зажимаем в [10 .. баланс] с кратностью 10 — кнопка всегда отвечает
  let newBet = gameState.betAmount + amount;
  newBet = Math.min(Math.max(10, newBet), gameState.coinBalance);
  newBet = Math.floor(newBet / 10) * 10;
  if (newBet >= 10 && newBet !== gameState.betAmount) {
    gameState.betAmount = newBet;
    updateUI();
  } else if (gameState.betAmount <= 10 && amount < 0) {
    showToast('Минимальная ставка — 10');
  }
}

function setBet(amount) {
  if (gameState.status !== 'idle' && gameState.status !== 'finished') return;

  const clamped = Math.max(10, Math.min(amount, gameState.coinBalance));
  if (clamped >= 10) {
    gameState.betAmount = clamped;
    updateUI();
  } else {
    showToast('Недостаточно монет для ставки');
  }
}

// ========================================
// BOARD RENDERING
// ========================================

function renderBoard() {
  elements.board.innerHTML = '';
  
  // Adjust grid CSS based on board size
  elements.board.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
  elements.board.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;
  
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.setAttribute('aria-label', `Клетка ${i + 1}`);
    
    cell.innerHTML = `
      <div class="cell-inner">
        <img 
          src="${ASSETS.cellClosed}" 
          alt="" 
          class="cell-image"
          aria-hidden="true"
        />
      </div>
    `;
    
    cell.addEventListener('click', () => handleCellClick(i));
    elements.board.appendChild(cell);
  }
}

// ========================================
// GAME LOGIC
// ========================================

function startGame() {
  if (gameState.status !== 'idle' && gameState.status !== 'finished') return;

  if (gameState.betAmount > gameState.coinBalance) {
    showToast('Недостаточно монет!');
    return;
  }

  // Deduct bet
  gameState.coinBalance -= gameState.betAmount;
  saveBalance();
  gameState.revealedCells = [];
  gameState.multiplier = 1.00;
  gameState.currentWinnings = gameState.betAmount; // Текущий выигрыш = ставка возвращается
  gameState.winningsCredited = false;
  gameState.status = 'playing';
  
  // Generate mine positions
  generateMinePositions();

  playSound('start');

  // Update UI
  updateUI();
  renderBoard();
  
  // Haptic feedback
  triggerHapticFeedback('light');
}

function generateMinePositions() {
  gameState.minePositions = [];
  
  const positions = Array.from({ length: totalCells }, (_, i) => i);
  shuffleArray(positions);
  
  gameState.minePositions = positions.slice(0, gameState.minesCount);
  gameState.firstClickSafe = true;
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function handleCellClick(index) {
  if (gameState.status !== 'playing') return;
  if (gameState.revealedCells.includes(index)) return;
  
  // Reveal cell
  revealCell(index);
}

function revealCell(index) {
  // первый клик всегда безопасен: если это мина — переносим её в свободную ячейку
  if (gameState.firstClickSafe && gameState.revealedCells.length === 0 && gameState.minePositions.includes(index)) {
    const free = [];
    for (let i = 0; i < 25; i++) {
      if (!gameState.minePositions.includes(i) && i !== index) free.push(i);
    }
    const relocate = free[Math.floor(Math.random() * free.length)];
    gameState.minePositions = gameState.minePositions.map((m) => (m === index ? relocate : m));
  }
  
  gameState.status = 'safe_reveal';
  
  const cell = elements.board.children[index];
  const isMine = gameState.minePositions.includes(index);
  
  // Animate tap
  cell.classList.add('tapped');
  
  setTimeout(() => {
    cell.classList.remove('tapped');
    
    if (isMine) {
      hitMine(index, cell);
    } else {
      revealSafeCell(index, cell);
    }
  }, 90);
}

function immediateReveal(index) {
  gameState.revealedCells.push(index);
  
  const cell = elements.board.children[index];
  const isMine = gameState.minePositions.includes(index);
  
  if (isMine) {
    hitMineImmediate(index, cell);
  } else {
    revealSafeCellImmediate(index, cell);
  }
  
  updateUI();
}

function revealSafeCell(index, cell) {
  gameState.revealedCells.push(index);
  
  // Множитель из честной вероятности для текущего шага
  const step = gameState.revealedCells.length;
  gameState.multiplier = multiplierFor(gameState.minesCount, step);
  gameState.currentWinnings = Math.floor(gameState.betAmount * gameState.multiplier);

  // Update UI with animation
  updateMultiplierDisplay();
  
  // Show reward
  const cellInner = cell.querySelector('.cell-inner');
  cellInner.innerHTML = `
    <img 
      src="${ASSETS.diamond}" 
      alt="Diamond" 
      class="cell-image"
      loading="lazy"
    />
  `;
  
  cell.classList.add('revealed', 'safe');

  playSound('reveal');

  // Particle effect
  createParticles(cell.getBoundingClientRect());
  
  // Check if all safe cells revealed
  const safeCells = totalCells - gameState.minesCount;
  if (gameState.revealedCells.length === safeCells) {
    completeGame(true);
    return;
  }
  
  // Enable cash out
  enableCashOut();
  
  gameState.status = 'playing';
}

function revealSafeCellImmediate(index, cell) {
  gameState.revealedCells.push(index);
  
  const step = gameState.revealedCells.length;
  gameState.multiplier = multiplierFor(gameState.minesCount, step);
  gameState.currentWinnings = Math.floor(gameState.betAmount * gameState.multiplier);
  
  const cellInner = cell.querySelector('.cell-inner');
  cellInner.innerHTML = `
    <img 
      src="${ASSETS.diamond}" 
      alt="Diamond" 
      class="cell-image"
    />
  `;
  
  cell.classList.add('revealed', 'safe');

  playSound('reveal');

  const safeCells = totalCells - gameState.minesCount;
  if (gameState.revealedCells.length === safeCells) {
    completeGameImmediate(true);
    return;
  }
  
  enableCashOut();
}

function updateMultiplierDisplay() {
  elements.currentMultiplier.classList.remove('updated');
  void elements.currentMultiplier.offsetWidth; // Trigger reflow
  elements.currentMultiplier.classList.add('updated');
  elements.currentMultiplier.textContent = gameState.multiplier.toFixed(2) + 'x';
}

function hitMine(index, cell) {
  gameState.status = 'mine_hit';
  
  // Show active mine with prominent glowing icon and blast effect
  const cellInner = cell.querySelector('.cell-inner');
  cellInner.innerHTML = `
    <img 
      src="${ASSETS.mine}" 
      alt="Mine" 
      class="cell-image mine-active-img"
    />
    <div class="cell-explosion-blast"></div>
  `;
  
  cell.classList.add('revealed', 'mine-hit');

  // Trigger haptic feedback and sound immediately
  triggerHapticFeedback('error');
  playSound('mine');

  // Screen shake
  document.body.classList.add('screen-shake');
  setTimeout(() => {
    document.body.classList.remove('screen-shake');
  }, 320);

  // Extra particles / lottie explosion
  spawnCellExplosion(cell);
  
  // Reveal all remaining mines across the board with graceful cascade
  setTimeout(() => {
    revealAllMines();
  }, 120);

  // End game cleanly after explosion and reveal (550ms)
  setTimeout(() => {
    completeGame(false);
  }, 550);
}

function hitMineImmediate(index, cell) {
  gameState.status = 'finished';
  
  const cellInner = cell.querySelector('.cell-inner');
  cellInner.innerHTML = `
    <img 
      src="${ASSETS.mine}" 
      alt="Mine" 
      class="cell-image"
    />
  `;
  
  cell.classList.add('revealed', 'mine-hit');
  
  revealAllMinesImmediate();
  
  completeGameImmediate(false);
}

function revealAllMines() {
  const cells = elements.board.children;
  
  gameState.minePositions.forEach((pos, i) => {
    setTimeout(() => {
      const cell = cells[pos];
      if (!cell || cell.classList.contains('revealed')) return;
      
      const cellInner = cell.querySelector('.cell-inner');
      cellInner.innerHTML = `
        <img 
          src="${ASSETS.mine}" 
          alt="Mine" 
          class="cell-image"
          loading="lazy"
        />
      `;
      cell.classList.add('revealed');
    }, i * 25);
  });
}

function revealAllMinesImmediate() {
  const cells = elements.board.children;
  
  gameState.minePositions.forEach(pos => {
    const cell = cells[pos];
    if (!cell || cell.classList.contains('revealed')) return;
    
    const cellInner = cell.querySelector('.cell-inner');
    cellInner.innerHTML = `
      <img 
        src="${ASSETS.mine}" 
        alt="Mine" 
        class="cell-image"
      />
    `;
    cell.classList.add('revealed');
  });
}

function enableCashOut() {
  // Показываем текущий выигрыш который может забрать игрок
  elements.cashoutBtn.style.display = 'flex';
  elements.cashoutAmount.textContent = gameState.currentWinnings;
  elements.playBtn.style.display = 'none';
}

function cashOut() {
  if (gameState.status !== 'playing') return;

  gameState.status = 'cashed_out';

  playSound('cashout');

  completeGame(true);
}

function completeGame(isWin) {
  gameState.status = 'finished';

  // Начисляем выигрыш один раз: и при "Забрать", и при вскрытии всех безопасных клеток
  if (isWin && !gameState.winningsCredited) {
    gameState.coinBalance += gameState.currentWinnings;
    gameState.winningsCredited = true;
  }

  saveBalance();
  updateUI();

  if (isWin) {
    setTimeout(() => {
      showWinScene();
    }, 300);
  } else {
    showLossScene();
  }
}

function completeGameImmediate(isWin) {
  gameState.status = 'finished';

  if (isWin && !gameState.winningsCredited) {
    gameState.coinBalance += gameState.currentWinnings;
    gameState.winningsCredited = true;
  }

  updateUI();

  if (isWin) {
    showWinSceneImmediate();
  } else {
    showLossSceneImmediate();
  }
}

// Плавный счётчик суммы выигрыша
function animateWinningsCounter() {
  const target = gameState.currentWinnings;
  const duration = 900;
  const startTime = performance.now();

  const tick = (now) => {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
    elements.winningsValue.textContent = `+${Math.round(target * eased)}`;
    if (progress < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function lightWinStars() {
  const stars = elements.winStars.querySelectorAll('.star');
  const litCount = gameState.multiplier >= 2.5 ? 3 : gameState.multiplier >= 1.5 ? 2 : 1;
  stars.forEach((star, i) => {
    star.classList.remove('lit');
    if (i < litCount) {
      setTimeout(() => star.classList.add('lit'), 150 + i * 180);
    }
  });
}

}

// Взрыв, зажатый внутри клетки: Lottie-контейнер растянут на клетку,
// а overflow:hidden у .cell не даёт огню выходить за её границы
function spawnCellExplosion(cell) {
  if (!prefersReducedMotion && window.lottie) {
    const holder = document.createElement('div');
    holder.className = 'lottie-explosion-in-cell';
    cell.appendChild(holder);

    let removed = false;
    const remove = () => {
      if (removed) return;
      removed = true;
      holder.remove();
    };

    try {
      const animation = lottie.loadAnimation({
        container: holder,
        renderer: 'svg',
        loop: false,
        autoplay: true,
        animationData: LOSY_EXPLOSION_DATA
      });
      animation.addEventListener('complete', remove);
    } catch (e) {
      remove();
    }
    setTimeout(remove, 2000);
    return;
  }

  const inner = cell.querySelector('.cell-inner');
  if (inner) {
    inner.innerHTML = `
      <img
        src="${ASSETS.explosion}"
        alt="Explosion"
        class="cell-image"
      />
    `;
  }
}

function spawnExplosion(x, y, size) {
  if (!prefersReducedMotion && window.lottie) {
    const holder = document.createElement('div');
    holder.className = 'lottie-explosion';
    holder.style.left = `${x}px`;
    holder.style.top = `${y}px`;
    holder.style.width = `${size}px`;
    holder.style.height = `${Math.round(size * 87 / 134)}px`; // аспект анимации 134x87
    document.body.appendChild(holder);

    let removed = false;
    const remove = () => {
      if (removed) return;
      removed = true;
      holder.remove();
    };

    try {
      const animation = lottie.loadAnimation({
        container: holder,
        renderer: 'svg',
        loop: false,
        autoplay: true,
        animationData: LOSY_EXPLOSION_DATA
      });
      animation.addEventListener('complete', remove);
    } catch (e) {
      remove();
    }
    setTimeout(remove, 2000); // страховка, если 'complete' не пришёл
    return;
  }

  createExplosion({ left: x - size / 2, top: y - size / 2, width: size, height: size });
}

function createExplosion(rect) {
  const explosion = document.createElement('div');
  explosion.className = 'explosion-overlay';
  explosion.innerHTML = `
    <img 
      src="${ASSETS.explosion}" 
      alt="Explosion" 
      style="width: 200px; height: 200px;"
    />
  `;
  
  explosion.style.left = `${rect.left}px`;
  explosion.style.top = `${rect.top}px`;
  explosion.style.position = 'fixed';
  explosion.style.zIndex = '99';
  
  document.body.appendChild(explosion);
  
  setTimeout(() => explosion.remove(), 400);
}

// ========================================
// GENERAL PARTICLES
// ========================================

function createParticles(rect) {
  if (prefersReducedMotion) return;

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  for (let i = 0; i < 12; i++) {
    createParticle(centerX, centerY, false, i * 15);
  }
}

function createParticle(x, y, isSuccess, delay = 0) {
  const colors = isSuccess
    ? [LOSY_COLORS.gold, LOSY_COLORS.cyan, LOSY_COLORS.violet]
    : [LOSY_COLORS.cyan, LOSY_COLORS.blue, LOSY_COLORS.white];

  const particle = document.createElement('div');
  particle.className = 'particle';

  particle.style.left = `${x}px`;
  particle.style.top = `${y}px`;
  particle.style.width = '6px';
  particle.style.height = '6px';
  particle.style.background = colors[Math.floor(Math.random() * colors.length)];
  particle.style.borderRadius = '50%';

  const angle = (Math.PI * 2 * Math.random());
  const velocity = 50 + Math.random() * 50;
  const tx = Math.cos(angle) * velocity;
  const ty = Math.sin(angle) * velocity;

  particle.style.setProperty('--tx', `${tx}px`);
  particle.style.setProperty('--ty', `${ty}px`);
  particle.style.opacity = '0';
  if (delay) particle.style.animationDelay = `${delay}ms`;

  document.body.appendChild(particle);

  setTimeout(() => particle.remove(), 1500 + delay);
}

// ========================================
// RESULT MODAL
// ========================================

function hideResultOverlay() {
  elements.resultOverlay.classList.remove('is-visible');
  elements.resultOverlay.setAttribute('aria-hidden', 'true');
  elements.confettiContainer.innerHTML = '';
}

function showNewGameMenu() {
  hideResultOverlay();
  elements.board.style.opacity = '1';
  gameState.status = 'idle';
  gameState.multiplier = 1.00;
  gameState.currentWinnings = gameState.betAmount;

  // Полный сброс обеих сцен: убираем .active и все "призрачные" .visible классы,
  // иначе содержимое прошлого раунда просвечивает в следующем
  elements.winScene.classList.remove('active');
  elements.lossScene.classList.remove('active');
  [elements.winText, elements.winRewards, elements.multiplierBadge].forEach(el => el.classList.remove('visible'));
  elements.winStars.querySelectorAll('.star').forEach(star => star.classList.remove('lit'));
  elements.confettiContainer.innerHTML = '';

  updateUI();
  renderBoard();
}

// ========================================
// UTILITY FUNCTIONS
// ========================================

function updateUI() {
  // Update displays
  elements.minesValue.textContent = gameState.minesCount;
  elements.betValue.textContent = gameState.betAmount;
  elements.currentMultiplier.textContent = gameState.multiplier.toFixed(2) + 'x';
  elements.cashoutAmount.textContent = gameState.currentWinnings;
  elements.coinBalance.textContent = gameState.coinBalance;
  if (elements.diamondBalance) elements.diamondBalance.textContent = gameState.diamondBalance;
  
  // Disable controls when playing
  const isPlaying = gameState.status === 'playing' || gameState.status === 'safe_reveal';
  
  [elements.minesDec, elements.minesInc, elements.betDec, elements.betInc].forEach(btn => {
    btn.disabled = isPlaying;
  });
  
  document.querySelectorAll('.bet-quick-btn').forEach(btn => {
    btn.disabled = isPlaying;
  });
  
  // Show/hide game buttons based on state
  if (gameState.status === 'idle' || gameState.status === 'finished') {
    elements.playBtn.style.display = 'flex';
    elements.cashoutBtn.style.display = 'none';
  } else if (gameState.status === 'playing') {
    elements.playBtn.style.display = 'none';
    elements.cashoutBtn.style.display = 'flex';
  }
}

function triggerHapticFeedback(type) {
  if (window.Telegram && window.Telegram.WebApp) {
    switch (type) {
      case 'light':
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        break;
      case 'success':
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        break;
      case 'error':
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
        break;
    }
  }
}

// ========================================
// RESUME FUNCTION FOR HOT RELOAD
// ========================================

if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
  window.handleHotReload = () => {
    location.reload();
  };
}
